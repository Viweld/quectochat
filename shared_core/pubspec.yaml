name: shared_core
publish_to: none
description: Shared kernel — appLocator, localization, BLoC helpers, utilities.

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.38.0 <4.0.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  get_it: ^9.2.1
  injectable: ^3.0.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  crypto: ^3.0.7
  auto_route: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  injectable_generator: ^3.0.2

flutter:
  generate: true
