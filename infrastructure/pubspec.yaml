name: infrastructure
publish_to: none
description: Frameworks and drivers — Firebase bootstrap, SDK wrappers (no business API).

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.38.0 <4.0.0'

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  app_badge_plus: ^1.3.2
  firebase_core: ^4.12.1
  firebase_crashlytics: ^5.2.6
  firebase_messaging: ^16.4.3
  injectable: ^3.0.0
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
  injectable_generator: ^3.0.2
