name: quectochat
description: "QuectoChat — Flutter+Supabase chat (Feature-First workspace)"
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.38.0 <4.0.0'

workspace:
  - shared_core
  - shared_ui
  - shared_domain
  - infrastructure
  - navigation_api
  - navigation
  - features/auth
  - features/home
  - features/chat

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_core:
    path: ./shared_core
  shared_ui:
    path: ./shared_ui
  shared_domain:
    path: ./shared_domain
  infrastructure:
    path: ./infrastructure
  navigation_api:
    path: ./navigation_api
  navigation:
    path: ./navigation
  auth:
    path: ./features/auth
  home:
    path: ./features/home
  chat:
    path: ./features/chat

  flutter_bloc: ^9.1.1
  bloc_concurrency: 0.3.0
  injectable: ^3.0.0
  get_it: ^9.2.1
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
  firebase_messaging: ^16.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  injectable_generator: ^3.0.2
  freezed: ^3.2.5
  melos: ^7.0.0
  yaml: ^3.1.3
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: false

flutter_native_splash:
  android: true
  ios: true
  web: false
  color: "#FFFFFF"
  color_dark: "#2F635B"
  image: "shared_ui/resources/images/splash_logo.png"
  image_dark: "shared_ui/resources/images/splash_logo_dark.png"
  android_12:
    color: "#FFFFFF"
    color_dark: "#2F635B"
    image: "shared_ui/resources/images/splash_logo.png"
    image_dark: "shared_ui/resources/images/splash_logo_dark.png"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "shared_ui/resources/images/icon.png"
  remove_alpha_ios: true
